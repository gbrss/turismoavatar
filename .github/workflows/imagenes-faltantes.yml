name: Imágenes faltantes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-missing.mjs', '.github/workflows/imagenes-faltantes.yml']

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/fetch-missing.mjs
      - name: Guardar en el repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/assets/media migration/original/faltantes.json || true
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "chore(migración): descargar imágenes faltantes (anti-hotlink)"
            git pull --rebase origin main
            git push
          fi
