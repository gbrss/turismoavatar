name: Migrar WordPress

# Exporta contenido e imágenes de www.turismoavatar.cl (WordPress) al repo.
# Se ejecuta a mano desde Actions → "Migrar WordPress" → Run workflow.
# Si el hosting bloquea a GitHub, ejecuta `npm run wp:export` desde tu computador.
on:
  workflow_dispatch:
    inputs:
      all_media:
        description: 'Descargar toda la biblioteca de medios (no solo las imágenes usadas)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: migrar-wordpress
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exportar WordPress
        run: node scripts/export-wp.mjs
        env:
          ALL_MEDIA: ${{ inputs.all_media && '1' || '0' }}
      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/media migration/wp-export
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore(migración): exportar contenido e imágenes desde WordPress"
            git pull --rebase origin main
            git push
          fi
