name: Video hero (candidatos)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/yt-candidatos.py']
permissions:
  contents: write
jobs:
  candidatos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 scripts/yt-candidatos.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A migration/hero-video || true
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "chore(hero): tramos candidatos del video"
            git pull --rebase origin main && git push
          fi
