name: Extraer generador de programas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/extract-programas.mjs', '.github/workflows/extraer-programas.yml']

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/extract-programas.mjs
      - name: Guardar en el repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A migration/original/programas || true
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "chore(migración): extraer generador de programas turísticos"
            git pull --rebase origin main && git push
          fi
