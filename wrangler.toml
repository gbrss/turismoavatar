# Configuración de Cloudflare Pages (proyecto: turismoavatar)
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "turismoavatar"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Base de datos D1: reservas, mensajes, newsletter, conversaciones de Cami y panel /admin.
# Tablas: db/schema.sql (npm run db:init)
[[d1_databases]]
binding = "DB"
database_name = "turismoavatar"
database_id = "f6ad9e82-7b3e-413b-b28b-9817a1233a6a"

# Fotos y videos que sube el dueño desde el panel (/admin). Para activarlo:
#   1) npx wrangler r2 bucket create turismoavatar-media
#   2) descomenta el bloque
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "turismoavatar-media"

# Workers AI para el chatbot (sin API keys externas).
[ai]
binding = "AI"

[vars]
SITE_NAME = "Turismo Avatar"
WHATSAPP_NUMBER = "56949981427"
NOTIFY_EMAIL = "contacto@turismoavatar.cl"
MAIL_FROM = "Turismo Avatar <reservas@turismoavatar.cl>"
# Panel /admin: repositorio donde publica el editor visual
GITHUB_REPO = "gbrss/turismoavatar"
GITHUB_BRANCH = "main"
# Secrets (configurar en el dashboard o con `wrangler pages secret put`):
#   RESEND_API_KEY      → envío de emails de reservas
#   TURNSTILE_SECRET    → antispam de formularios (opcional)
#   (todo lo del panel se configura con: bash scripts/setup-admin.sh)
#   CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD → login del panel /admin con código al correo (Cloudflare Access)
#   GITHUB_TOKEN        → el panel publica cambios del editor (commit al repo → Pages reconstruye)
#   ADMIN_PASSWORD      → respaldo: usuario "admin" + contraseña, solo si Access no está configurado
# Guía completa: ADMIN.md
